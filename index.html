<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#003da5" />
  <title>Neige au Québec</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      color-scheme: light;
      --blue: #003da5;
      --blue-light: #edf4ff;
      --ink: #172b4d;
      --muted: #61738d;
      --line: #e0e8f2;
      --card: #fff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: #f3f7fc;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site-header {
      min-height: 68px;
      display: flex;
      align-items: center;
      padding: 12px clamp(18px, 4vw, 52px);
      color: #fff;
      background: linear-gradient(110deg, #003da5, #0758bd);
      box-shadow: 0 3px 14px #00316a26;
    }

    .site-header h1 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-size: clamp(20px, 2.4vw, 27px);
      font-weight: 720;
      letter-spacing: -.035em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #ffffff62;
      border-radius: 11px;
      background: #ffffff19;
      font-size: 19px;
      line-height: 1;
    }

    main {
      width: min(100%, 1680px);
      flex: 1;
      margin: 0 auto;
      padding: clamp(14px, 2.2vw, 28px);
    }

    #map-wrap {
      position: relative;
      height: min(78vh, 850px);
      min-height: 500px;
      overflow: hidden;
      border: 1px solid #dfe7f1;
      border-radius: 20px;
      background: #dce8f4;
      box-shadow: 0 12px 36px #19385d14, 0 2px 6px #19385d0a;
      isolation: isolate;
    }

    #map { position: absolute; inset: 0; background: #e6eef7; }

    .map-card {
      position: absolute;
      z-index: 1000;
      border: 1px solid #ffffffd9;
      border-radius: 14px;
      background: #fffffff2;
      box-shadow: 0 8px 26px #17365b1c, 0 1px 3px #17365b12;
      backdrop-filter: blur(12px);
    }

    #panel {
      top: 16px;
      left: 16px;
      width: min(380px, calc(100% - 32px));
      padding: 15px 16px 13px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    #date-label {
      display: block;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.025em;
      text-transform: capitalize;
      font-variant-numeric: tabular-nums;
    }

    #date-picker {
      width: 144px;
      flex: 0 0 144px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 12px;
    }

    #date-picker:focus-visible, #panel button:focus-visible, #slider:focus-visible {
      outline: 3px solid #78a8f7;
      outline-offset: 2px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #panel button {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue);
      background: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      line-height: 1;
      transition: background-color .15s, border-color .15s;
    }

    #panel button:hover:not(:disabled) {
      border-color: #b6cbed;
      background: var(--blue-light);
    }

    #panel button:disabled { cursor: not-allowed; opacity: .45; }

    #slider {
      width: 100%;
      min-width: 0;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    #ends {
      display: flex;
      justify-content: space-between;
      margin: 3px 37px 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 550;
    }

    #status {
      min-height: 16px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    #status[data-state="error"] { color: #a33b2f; }

    #retry-button {
      width: auto !important;
      height: 30px !important;
      display: inline-flex !important;
      gap: 6px;
      margin-top: 6px;
      padding: 0 10px !important;
      font-size: 11px !important;
      font-weight: 650 !important;
    }

    #retry-button[hidden] { display: none !important; }

    #legend {
      bottom: 16px;
      left: 16px;
      width: min(270px, calc(100% - 32px));
      padding: 12px 14px 10px;
    }

    .legend-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .legend-heading strong { font-size: 12px; }
    .legend-heading span { color: var(--muted); font-size: 10px; }
    #legend-bar { height: 9px; border: 1px solid #19385d12; border-radius: 99px; }
    .legend-source { margin-top: 6px; color: var(--muted); font-size: 10px; }
    #legend-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .leaflet-control-zoom a {
      color: var(--blue) !important;
      border-color: var(--line) !important;
    }

    .leaflet-control-attribution {
      border-radius: 6px 0 0 !important;
      color: #52657d;
    }

    @media (max-width: 560px) {
      .site-header { min-height: 60px; }
      .brand-mark { width: 30px; height: 30px; }
      main { padding: 10px; }
      #map-wrap {
        height: calc(100dvh - 82px);
        min-height: 520px;
        border-radius: 15px;
      }
      #panel { top: 10px; left: 10px; width: min(380px, calc(100% - 20px)); }
      #legend { bottom: 42px; left: 10px; width: min(250px, calc(100% - 20px)); }
      .leaflet-top.leaflet-right { top: 178px; }
      .leaflet-control-attribution {
        width: 96px;
        max-width: 96px;
        white-space: normal;
        font-size: 8px;
        line-height: 1.2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1><span class="brand-mark" aria-hidden="true">❄</span>Neige au Québec</h1>
  </header>
  <main>
    <div id="map-wrap">
      <div id="map" aria-label="Carte de la profondeur de neige au Québec"></div>
      <section id="panel" class="map-card" aria-label="Choisir une date">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">Neige au sol · midi UTC</span>
            <strong id="date-label">—</strong>
          </div>
          <input id="date-picker" type="date" aria-label="Choisir une date" />
        </div>
        <div class="slider-row">
          <button id="prev" type="button" aria-label="Jour précédent" title="Jour précédent">‹</button>
          <input id="slider" type="range" min="0" max="1" step="1" value="0" aria-label="Faire défiler les dates" />
          <button id="next" type="button" aria-label="Jour suivant" title="Jour suivant">›</button>
        </div>
        <div id="ends"><span>1990</span><span>Dernière donnée</span></div>
        <div id="status" role="status" aria-live="polite"></div>
        <button id="retry-button" type="button" hidden>↻ Réessayer</button>
      </section>
      <section id="legend" class="map-card" aria-label="Légende de la profondeur de neige">
        <div class="legend-heading"><strong>Épaisseur de neige</strong><span>au sol</span></div>
        <div id="legend-bar"></div>
        <div class="legend-source">ERA5-Land · Open-Meteo</div>
        <div id="legend-scale"><span>0 cm</span><span id="legend-max"></span></div>
      </section>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="dist/main.js"></script>
</body>
</html>
